openapi: 3.0.0
info:
  title: Shop API
  version: 1.0.0
  description: API для работы с продуктами, корзиной и заказами

servers:
  - url: http://localhost:8000/api
    description: Local server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Ноутбук"
        description:
          type: string
          example: "Игровой ноутбук 16GB RAM"
        price:
          type: number
          format: float
          example: 1200.50
        stock:
          type: integer
          example: 10

    CartItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          example: 2

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total:
          type: number
          format: float
          example: 2401.0
        status:
          type: string
          example: "PENDING"

security:
  - bearerAuth: []

paths:
  /products/:
    get:
      summary: Список всех продуктов
      tags: [Products]
      responses:
        '200':
          description: Список продуктов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Создать новый продукт
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Продукт создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/{productId}/:
    get:
      summary: Получить продукт по ID
      tags: [Products]
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Продукт найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Продукт не найден
    put:
      summary: Обновить продукт
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Продукт обновлен
    delete:
      summary: Удалить продукт
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Продукт удален

  /cart/:
    get:
      summary: Получить содержимое корзины
      tags: [Cart]
      responses:
        '200':
          description: Корзина
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItem'
    post:
      summary: Добавить продукт в корзину
      tags: [Cart]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: integer
                quantity:
                  type: integer
      responses:
        '201':
          description: Продукт добавлен в корзину

  /cart/{cartItemId}/:
    put:
      summary: Обновить количество товара в корзине
      tags: [Cart]
      parameters:
        - in: path
          name: cartItemId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
      responses:
        '200':
          description: Количество обновлено
    delete:
      summary: Удалить товар из корзины
      tags: [Cart]
      parameters:
        - in: path
          name: cartItemId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Товар удален

  /orders/:
    get:
      summary: Список всех заказов
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      summary: Создать заказ из корзины
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}/:
    get:
      summary: Получить заказ по ID
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Заказ найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Заказ не найден
